; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sans cette ligne, « Upload » (ou « pio run -t upload ») compile ET téléverse TOUS les
; environnements à la suite : le dernier, test_relais, écrasait alors le vrai programme.
; Le banc d'essai se lance explicitement : pio run -e test_relais -t upload
[platformio]
default_envs = esp32dev

; Environnement normal de production (Code complet AOCEDA)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_filters = printable, time, log2file
monitor_speed = 115200
upload_port = COM4
; Tout src/ est compile (config, domaine, systeme, materiel, reseau, application) :
; -I src permet d'ecrire #include "domaine/Detection.h" depuis n'importe quel fichier.
build_flags = -I src
; Capteur de temperature et d'humidite DHT11 (S -> GPIO 4, + -> 3V3, - -> GND)
lib_deps =
    adafruit/DHT sensor library @ 1.4.6
    adafruit/Adafruit Unified Sensor @ 1.1.14

; Environnement de test isolé des relais (Banc d'essai autonome)
[env:test_relais]
platform = espressif32
board = esp32dev
framework = arduino
monitor_filters = printable, time, log2file
monitor_speed = 115200
upload_port = COM4
build_src_filter = +<../test/test_relais.cpp>

; Tests du domaine (detection, grandeurs electriques, trame JSON) : logique pure, sans carte.
; Ils tournent sur le PC : pio test -e native
; (sous Windows, le compilateur MinGW est installe par platform_packages ci-dessous)
[env:native]
platform = native
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = pre:test/chemin_mingw.py
test_framework = unity
test_filter = test_domaine
test_build_src = yes
build_flags = -I src -std=gnu++11
build_src_filter = +<domaine/>
