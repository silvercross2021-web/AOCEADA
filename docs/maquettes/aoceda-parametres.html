<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AOCEDA — Paramètres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root{
      --e2:#FAD08F;--e3:#F7B558;--e5:#C9760E;--e6:#A05808;
      --c5:#1B7A6E;--s50:#FDFAF6;--s100:#F5F0E8;--s200:#E8DDD0;--s300:#D4C5B0;
      --s400:#BAAB92;--s600:#7A6854;--s900:#221C14;
      --err:#D93025;--ok:#1B7A50;
      --bg-p:var(--s50);--bg-s:#FFF;--bg-h:var(--s100);--bg-a:var(--s200);
      --tx-p:var(--s900);--tx-s:var(--s600);--tx-m:var(--s400);
      --bd-s:var(--s200);--bd-d:var(--s300);
      --ac:var(--e5);--ac-h:var(--e6);
      --fd:'Space Grotesk',system-ui,sans-serif;--fb:'DM Sans',system-ui,sans-serif;
      --ts:300ms ease;--tb:200ms ease;--sh:0 1px 3px rgba(34,28,20,.07);
    }
    [data-theme="dark"]{
      --bg-p:#0D1117;--bg-s:#161C26;--bg-h:rgba(255,255,255,.05);--bg-a:rgba(255,255,255,.08);
      --tx-p:#E8E2D8;--tx-s:#9C8870;--tx-m:#8E7F69;
      --bd-s:rgba(255,255,255,.06);--bd-d:rgba(255,255,255,.10);
      --ac:var(--e3);--ac-h:var(--e2);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{min-height:100%}
    body{font-family:var(--fb);background:var(--bg-p);color:var(--tx-p);-webkit-font-smoothing:antialiased;transition:background var(--ts),color var(--ts)}

    .topbar{display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;background:var(--bg-s);border-bottom:1px solid var(--bd-s);position:sticky;top:0;z-index:10;transition:background var(--ts)}
    .back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx-s);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:6px;font-family:var(--fb);text-decoration:none;transition:all var(--tb)}
    .back-btn:hover{background:var(--bg-h);color:var(--tx-p)}
    .sep{width:1px;height:20px;background:var(--bd-s);flex-shrink:0}
    .topbar-title{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--tx-p)}
    .topbar-right{margin-left:auto;display:flex;gap:8px}
    .icon-btn{width:34px;height:34px;border-radius:7px;background:var(--bg-h);border:1px solid var(--bd-s);color:var(--tx-s);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tb)}
    .icon-btn:hover{background:var(--bg-a);color:var(--tx-p)}

    .layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px);max-width:1100px;margin:0 auto}
    @media(max-width:768px){.layout{grid-template-columns:1fr}.side-nav{display:none}}
    .side-nav{padding:20px 12px;border-right:1px solid var(--bd-s);background:var(--bg-s);transition:background var(--ts)}
    .snav-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-m);padding:10px 10px 6px}
    .snav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--tx-s);cursor:pointer;transition:all var(--tb);margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:var(--fb)}
    .snav-item:hover{background:var(--bg-h);color:var(--tx-p)}
    .snav-item.active{background:rgba(201,118,14,.09);color:var(--ac);font-weight:600}
    [data-theme="dark"] .snav-item.active{background:rgba(247,181,88,.08)}
    .snav-divider{height:1px;background:var(--bd-s);margin:10px 0}

    .content{padding:28px 32px;max-width:700px}
    @media(max-width:768px){.content{padding:20px 16px}}

    /* Sections */
    .section{margin-bottom:32px}
    .section-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--tx-p);letter-spacing:-.3px;margin-bottom:4px}
    .section-sub{font-size:13px;color:var(--tx-s);margin-bottom:20px;line-height:1.5}
    .card{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:12px;padding:22px 24px;box-shadow:var(--sh);transition:background var(--ts)}
    .divider{height:1px;background:var(--bd-s);margin:18px 0}

    /* Avatar */
    .avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--e5),var(--c5));display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:22px;font-weight:700;color:#fff;flex-shrink:0}
    .avatar-info .name{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--tx-p);margin-bottom:2px}
    .avatar-info .role{font-size:12px;color:var(--tx-m)}
    .cie-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:rgba(27,122,110,.10);border:1px solid rgba(27,122,110,.20);color:var(--c5);font-family:var(--fd);margin-top:4px}

    /* Form */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
    @media(max-width:500px){.form-grid{grid-template-columns:1fr}}
    .fg{margin-bottom:0}
    .fg.full{grid-column:1/-1}
    .fl{display:block;font-size:12px;font-weight:600;color:var(--tx-p);margin-bottom:5px;letter-spacing:.01em}
    .fl .opt{font-weight:400;color:var(--tx-m);margin-left:4px;font-size:11px}
    .fi{width:100%;height:42px;padding:0 12px;background:var(--bg-p);border:1.5px solid var(--bd-d);border-radius:8px;font-family:var(--fb);font-size:14px;color:var(--tx-p);outline:none;transition:all var(--tb)}
    .fi:focus{border-color:var(--ac);background:var(--bg-s);box-shadow:0 0 0 3px rgba(201,118,14,.10)}
    .fi:disabled{opacity:.55;cursor:not-allowed;background:var(--bg-h)}
    .fi-sel{width:100%;height:42px;padding:0 12px;background:var(--bg-p);border:1.5px solid var(--bd-d);border-radius:8px;font-family:var(--fb);font-size:14px;color:var(--tx-p);outline:none;cursor:pointer;transition:all var(--tb)}
    .fi-sel:focus{border-color:var(--ac)}

    /* Buttons */
    .btn-row{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
    .btn-save{height:40px;padding:0 22px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tb)}
    .btn-save:hover{background:var(--ac-h);transform:translateY(-1px)}
    .btn-cancel{height:40px;padding:0 18px;background:transparent;border:1.5px solid var(--bd-d);border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:500;color:var(--tx-s);cursor:pointer;transition:all var(--tb)}
    .btn-cancel:hover{background:var(--bg-h);color:var(--tx-p)}
    .btn-edit{height:36px;padding:0 16px;background:transparent;border:1.5px solid var(--bd-d);border-radius:7px;font-family:var(--fb);font-size:12px;font-weight:500;color:var(--tx-s);cursor:pointer;transition:all var(--tb)}
    .btn-edit:hover{background:var(--bg-h);color:var(--tx-p)}
    .btn-danger{height:40px;padding:0 18px;background:rgba(217,48,37,.08);border:1.5px solid rgba(217,48,37,.25);border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:600;color:var(--err);cursor:pointer;transition:all var(--tb)}
    .btn-danger:hover{background:rgba(217,48,37,.14)}
    .save-ok{font-size:13px;color:var(--ok);font-weight:500;display:flex;align-items:center;gap:5px}

    /* Radio pills */
    .radio-group{display:flex;gap:8px;flex-wrap:wrap}
    .ro{position:relative}
    .ro input{position:absolute;opacity:0;width:0;height:0}
    .rl{display:flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border:1.5px solid var(--bd-d);border-radius:8px;font-size:13px;font-weight:500;color:var(--tx-s);cursor:pointer;transition:all var(--tb);background:var(--bg-p);white-space:nowrap}
    .ro input:checked+.rl{border-color:var(--ac);background:rgba(201,118,14,.08);color:var(--ac)}

    /* Toggle */
    .tog-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
    .tog-lbl{font-size:14px;color:var(--tx-p);font-weight:500}
    .tog-sub{font-size:11px;color:var(--tx-m);margin-top:2px}
    .tog-track{width:38px;height:22px;border-radius:11px;background:var(--bd-d);position:relative;cursor:pointer;transition:background var(--tb);flex-shrink:0}
    .tog-track.on{background:var(--ac)}
    .tog-thumb{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform var(--tb);box-shadow:0 1px 3px rgba(0,0,0,.20)}
    .tog-track.on .tog-thumb{transform:translateX(16px)}

    /* Theme selector */
    .theme-options{display:flex;gap:10px;flex-wrap:wrap}
    .theme-opt{flex:1;min-width:100px;position:relative;cursor:pointer}
    .theme-opt input{position:absolute;opacity:0;width:0;height:0}
    .theme-box{border:2px solid var(--bd-d);border-radius:10px;padding:12px 10px;text-align:center;transition:all var(--tb)}
    .theme-opt input:checked+.theme-box{border-color:var(--ac)}
    .theme-box svg{margin:0 auto 6px}
    .theme-box-lbl{font-size:12px;font-weight:500;color:var(--tx-s)}
    .theme-opt input:checked+.theme-box .theme-box-lbl{color:var(--ac);font-weight:700}

    /* Password strength */
    .pwd-bars{display:flex;gap:3px;flex:1}
    .pbar{height:3px;flex:1;border-radius:2px;transition:background 200ms}
    .rules{margin-top:8px;display:flex;flex-direction:column;gap:3px}
    .rule{font-size:12px;color:var(--tx-s);display:flex;align-items:center;gap:6px}
    .rule.v{color:var(--ok)}

    /* Confirm modal */
    .overlay{position:fixed;inset:0;background:rgba(34,28,20,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
    .modal{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:14px;width:100%;max-width:420px;padding:28px;box-shadow:0 20px 48px rgba(0,0,0,.20)}
    .modal-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--tx-p);margin-bottom:8px}
    .modal-body{font-size:14px;color:var(--tx-s);line-height:1.6;margin-bottom:22px}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end}

    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;margin-right:6px;vertical-align:middle}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

function Toggle({on,toggle}){return(
  <div className={`tog-track${on?' on':''}`} onClick={toggle} role="switch" aria-checked={on}>
    <div className="tog-thumb"/>
  </div>
);}

function PwdStrength({pwd}){
  if(!pwd)return null;
  const s=(()=>{let x=0;if(pwd.length>=8)x++;if(pwd.length>=12)x++;if(/[A-Z]/.test(pwd))x++;if(/[0-9]/.test(pwd))x++;if(/[^A-Za-z0-9]/.test(pwd))x++;return x;})();
  const cols=['','#D93025','#E8920A','#D97700','#1B7A6E','#1B7A50'];
  const lbls=['','Très faible','Faible','Moyen','Fort','Très fort'];
  return<div style={{display:'flex',alignItems:'center',gap:8,marginTop:8}}>
    <div className="pwd-bars">{[1,2,3,4,5].map(i=><div key={i} className="pbar" style={{background:i<=s?cols[s]:'var(--bd-s)'}}/>)}</div>
    <span style={{fontSize:'11px',fontWeight:600,color:cols[s],whiteSpace:'nowrap'}}>{lbls[s]}</span>
  </div>;
}

const SECTIONS=[
  {id:'profil',label:'Informations personnelles',icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>},
  {id:'foyer',label:'Configuration du foyer',icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>},
  {id:'securite',label:'Sécurité',icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>},
  {id:'prefs',label:'Préférences',icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>},
  {id:'donnees',label:'Données & Confidentialité',icon:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>},
];

function SaveFeedback({ok}){
  if(!ok)return null;
  return<span className="save-ok">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    Enregistré
  </span>;
}

function App(){
  const [theme,setTheme]=useState(()=>localStorage.getItem('aoceda-theme')||'light');
  const [section,setSection]=useState('profil');
  const [editing,setEditing]=useState({profil:false,foyer:false});
  const [saved,setSaved]=useState({});
  const [delModal,setDelModal]=useState(false);
  const [pwdModal,setPwdModal]=useState(false);
  const [emailNotif,setEmailNotif]=useState(true);
  const [themeChoice,setThemeChoice]=useState(theme);
  const [oldPwd,setOldPwd]=useState('');
  const [newPwd,setNewPwd]=useState('');
  const [confirmPwd,setConfirmPwd]=useState('');
  const [savingPwd,setSavingPwd]=useState(false);
  const [pwdSaved,setPwdSaved]=useState(false);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('aoceda-theme',theme);},[theme]);

  const save=(sec)=>{setEditing(e=>({...e,[sec]:false}));setSaved(s=>({...s,[sec]:true}));setTimeout(()=>setSaved(s=>({...s,[sec]:false})),3000);};

  const submitPwd=()=>{
    if(!oldPwd||!newPwd||newPwd!==confirmPwd)return;
    setSavingPwd(true);
    setTimeout(()=>{setSavingPwd(false);setPwdSaved(true);setOldPwd('');setNewPwd('');setConfirmPwd('');setTimeout(()=>setPwdSaved(false),3000);},1600);
  };

  const rules=[{txt:'Minimum 8 caractères',ok:newPwd.length>=8},{txt:'Au moins 1 majuscule',ok:/[A-Z]/.test(newPwd)},{txt:'Au moins 1 chiffre',ok:/[0-9]/.test(newPwd)}];

  return<>
    <div className="topbar">
      <a href="aoceda-dashboard.html" className="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>
        Tableau de bord
      </a>
      <div className="sep"/>
      <span className="topbar-title">Paramètres</span>
      <div className="topbar-right">
        <button className="icon-btn" onClick={()=>setTheme(t=>t==='light'?'dark':'light')} aria-label="Changer de thème">
          {theme==='light'?<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>}
        </button>
      </div>
    </div>

    <div className="layout">
      {/* ── Side nav ── */}
      <nav className="side-nav">
        <div className="snav-label">Mon compte</div>
        {SECTIONS.map(s=><button key={s.id} className={`snav-item${section===s.id?' active':''}`} onClick={()=>setSection(s.id)}>
          {s.icon}{s.label}
        </button>)}
        <div className="snav-divider"/>
        <a href="aoceda-dashboard.html" className="snav-item" style={{textDecoration:'none'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Retour dashboard
        </a>
      </nav>

      {/* ── Content ── */}
      <div className="content">

        {/* ── Profil ── */}
        {section==='profil'&&<div className="section">
          <div className="section-title">Informations personnelles</div>
          <div className="section-sub">Votre identité sur AOCEDA. L'email ne peut pas être modifié directement.</div>
          <div className="card">
            <div className="avatar-row">
              <div className="avatar">AK</div>
              <div className="avatar-info">
                <div className="name">Konaté Adjoua</div>
                <div className="role">Client · Cocody, Abidjan</div>
                <div className="cie-tag">CI-ABJ-2024-05471</div>
              </div>
              <button className="btn-edit" onClick={()=>setEditing(e=>({...e,profil:!e.profil}))}>
                {editing.profil?'Annuler':'Modifier'}
              </button>
            </div>
            {editing.profil
              ?<div className="form-grid">
                <div className="fg"><label className="fl">Prénom</label><input className="fi" defaultValue="Adjoua"/></div>
                <div className="fg"><label className="fl">Nom</label><input className="fi" defaultValue="Konaté"/></div>
                <div className="fg full"><label className="fl">Adresse email <span className="opt">(lecture seule)</span></label><input className="fi" defaultValue="adjoua.konate@gmail.com" disabled/></div>
                <div className="fg full"><label className="fl">Téléphone <span className="opt">(facultatif)</span></label><input className="fi" defaultValue="+225 07 12 34 56 78" placeholder="+225 XX XX XX XX XX"/></div>
                <div className="btn-row" style={{gridColumn:'1/-1'}}>
                  <button className="btn-save" onClick={()=>save('profil')}>Enregistrer</button>
                  <button className="btn-cancel" onClick={()=>setEditing(e=>({...e,profil:false}))}>Annuler</button>
                  <SaveFeedback ok={saved.profil}/>
                </div>
              </div>
              :<div className="form-grid">
                {[['Prénom','Adjoua'],['Nom','Konaté'],['Email','adjoua.konate@gmail.com'],['Téléphone','+225 07 12 34 56 78']].map(([l,v],i)=>(
                  <div key={i} className={`fg${i>=2?' full':''}`}>
                    <label className="fl">{l}</label>
                    <div style={{padding:'10px 12px',background:'var(--bg-h)',borderRadius:8,fontSize:'14px',color:'var(--tx-p)',border:'1px solid var(--bd-s)'}}>{v}</div>
                  </div>
                ))}
              </div>}
          </div>
        </div>}

        {/* ── Foyer ── */}
        {section==='foyer'&&<div className="section">
          <div className="section-title">Configuration du foyer</div>
          <div className="section-sub">Ces informations servent à calculer votre tarif CIE et vos prévisions de facture.</div>
          <div className="card">
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:14}}>
              <button className="btn-edit" onClick={()=>setEditing(e=>({...e,foyer:!e.foyer}))}>
                {editing.foyer?'Annuler':'Modifier'}
              </button>
            </div>
            {editing.foyer
              ?<>
                <div className="fg" style={{marginBottom:16}}>
                  <label className="fl">Type de logement</label>
                  <div className="radio-group">{['Appartement','Villa','Maison'].map(v=><label key={v} className="ro"><input type="radio" name="log" defaultChecked={v==='Appartement'}/><span className="rl">{v}</span></label>)}</div>
                </div>
                <div className="fg" style={{marginBottom:16}}>
                  <label className="fl">Ampérage souscrit</label>
                  <div className="radio-group">{['5A','10A','15A','20A'].map(v=><label key={v} className="ro"><input type="radio" name="amp" defaultChecked={v==='15A'}/><span className="rl">{v}</span></label>)}</div>
                </div>
                <div className="fg" style={{marginBottom:16}}>
                  <label className="fl">Type de compteur</label>
                  <div className="radio-group">{['Postpayé','Prépayé','Intelligent'].map(v=><label key={v} className="ro"><input type="radio" name="cpt" defaultChecked={v==='Prépayé'}/><span className="rl">{v}</span></label>)}</div>
                </div>
                <div className="fg" style={{marginBottom:0}}>
                  <label className="fl">Numéro d'abonné CIE <span className="opt">(facultatif)</span></label>
                  <input className="fi" defaultValue="CI-ABJ-2024-05471"/>
                </div>
                <div className="btn-row">
                  <button className="btn-save" onClick={()=>save('foyer')}>Enregistrer</button>
                  <button className="btn-cancel" onClick={()=>setEditing(e=>({...e,foyer:false}))}>Annuler</button>
                  <SaveFeedback ok={saved.foyer}/>
                </div>
              </>
              :<div className="form-grid">
                {[['Type de logement','Appartement'],['Ampérage souscrit','15A — Tarif général'],['Type de compteur','Prépayé'],['Numéro abonné CIE','CI-ABJ-2024-05471']].map(([l,v],i)=>(
                  <div key={i} className="fg full">
                    <label className="fl">{l}</label>
                    <div style={{padding:'10px 12px',background:'var(--bg-h)',borderRadius:8,fontSize:'14px',color:'var(--tx-p)',border:'1px solid var(--bd-s)'}}>{v}</div>
                  </div>
                ))}
              </div>}
          </div>
        </div>}

        {/* ── Sécurité ── */}
        {section==='securite'&&<div className="section">
          <div className="section-title">Sécurité</div>
          <div className="section-sub">Gérez votre mot de passe et les accès à votre compte.</div>
          <div className="card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div>
                <div style={{fontWeight:600,fontSize:'14px',color:'var(--tx-p)'}}>Mot de passe</div>
                <div style={{fontSize:'12px',color:'var(--tx-m)',marginTop:2}}>Dernière modification : il y a 3 mois</div>
              </div>
              <button className="btn-edit" onClick={()=>setPwdModal(v=>!v)}>{pwdModal?'Annuler':'Changer'}</button>
            </div>
            {pwdModal&&<>
              <div className="divider"/>
              <div style={{display:'flex',flexDirection:'column',gap:14,marginTop:4}}>
                <div className="fg">
                  <label className="fl">Mot de passe actuel</label>
                  <input type="password" className="fi" value={oldPwd} onChange={e=>setOldPwd(e.target.value)} placeholder="Votre mot de passe actuel"/>
                </div>
                <div className="fg">
                  <label className="fl">Nouveau mot de passe</label>
                  <input type="password" className="fi" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Minimum 8 caractères"/>
                  <PwdStrength pwd={newPwd}/>
                  <div className="rules">{rules.map((r,i)=><div key={i} className={`rule${r.ok?' v':''}`}>
                    {r.ok?<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>}
                    {r.txt}
                  </div>)}</div>
                </div>
                <div className="fg">
                  <label className="fl">Confirmer le nouveau mot de passe</label>
                  <input type="password" className={`fi${confirmPwd&&confirmPwd!==newPwd?' ferr':''}`} value={confirmPwd} onChange={e=>setConfirmPwd(e.target.value)} placeholder="Répétez le mot de passe" style={confirmPwd&&confirmPwd!==newPwd?{borderColor:'var(--err)'}:{}}/>
                  {confirmPwd&&confirmPwd!==newPwd&&<div style={{fontSize:'12px',color:'var(--err)',marginTop:4}}>Les mots de passe ne correspondent pas</div>}
                </div>
              </div>
              <div className="btn-row" style={{marginTop:16}}>
                <button className="btn-save" onClick={submitPwd} disabled={savingPwd||!oldPwd||!newPwd||newPwd!==confirmPwd||newPwd.length<8}>
                  {savingPwd?<><span className="spinner"/>Mise à jour…</>:'Enregistrer le mot de passe'}
                </button>
                {pwdSaved&&<span className="save-ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>Mot de passe mis à jour</span>}
              </div>
            </>}
            <div className="divider"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:600,fontSize:'14px',color:'var(--tx-p)'}}>Authentification à deux facteurs</div>
                <div style={{fontSize:'12px',color:'var(--tx-m)',marginTop:2}}>Ajouter une couche de sécurité supplémentaire</div>
              </div>
              <span style={{fontSize:'11px',padding:'3px 10px',borderRadius:8,background:'rgba(27,122,80,.10)',color:'var(--ok)',fontWeight:700}}>Disponible v2</span>
            </div>
          </div>
        </div>}

        {/* ── Préférences ── */}
        {section==='prefs'&&<div className="section">
          <div className="section-title">Préférences</div>
          <div className="section-sub">Personnalisez votre expérience AOCEDA.</div>
          <div className="card">
            <div style={{fontWeight:600,fontSize:'14px',color:'var(--tx-p)',marginBottom:14}}>Thème d'interface</div>
            <div className="theme-options">
              {[{k:'light',lbl:'Clair',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>},
                {k:'dark',lbl:'Sombre',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>},
                {k:'auto',lbl:'Auto',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20" opacity=".3"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor" opacity=".2"/></svg>},
              ].map(opt=><label key={opt.k} className="theme-opt">
                <input type="radio" name="theme" value={opt.k} checked={themeChoice===opt.k} onChange={()=>{setThemeChoice(opt.k);if(opt.k!=='auto')setTheme(opt.k);}}/>
                <div className="theme-box"><div style={{color:'var(--tx-s)'}}>{opt.icon}</div><div className="theme-box-lbl">{opt.lbl}</div></div>
              </label>)}
            </div>
            <div className="divider"/>
            <div style={{fontWeight:600,fontSize:'14px',color:'var(--tx-p)',marginBottom:10}}>Notifications</div>
            <div className="tog-row">
              <div><div className="tog-lbl">Alertes par email</div><div className="tog-sub">Recevoir les alertes AOCEDA par email</div></div>
              <Toggle on={emailNotif} toggle={()=>setEmailNotif(v=>!v)}/>
            </div>
            <div className="divider"/>
            <div style={{fontWeight:600,fontSize:'14px',color:'var(--tx-p)',marginBottom:10}}>Langue</div>
            <div style={{padding:'10px 12px',background:'var(--bg-h)',borderRadius:8,fontSize:'14px',color:'var(--tx-p)',border:'1px solid var(--bd-s)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>Français (Côte d'Ivoire)</span>
              <span style={{fontSize:'11px',padding:'2px 8px',borderRadius:6,background:'rgba(27,122,80,.10)',color:'var(--ok)',fontWeight:700}}>Seule langue v1</span>
            </div>
          </div>
        </div>}

        {/* ── Données ── */}
        {section==='donnees'&&<div className="section">
          <div className="section-title">Données &amp; Confidentialité</div>
          <div className="section-sub">Gérez vos données personnelles et votre compte.</div>
          <div className="card">
            <div style={{fontWeight:600,fontSize:'14px',color:'var(--tx-p)',marginBottom:6}}>Exporter mes données</div>
            <p style={{fontSize:'13px',color:'var(--tx-s)',lineHeight:1.6,marginBottom:14}}>Téléchargez l'ensemble de vos données AOCEDA (consommation, alertes, paramètres) au format CSV.</p>
            <button className="btn-save">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{display:'inline-block',verticalAlign:'middle',marginRight:6}}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Exporter toutes mes données (CSV)
            </button>
            <div className="divider"/>
            <div style={{fontWeight:600,fontSize:'14px',color:'var(--err)',marginBottom:6}}>Zone de danger</div>
            <p style={{fontSize:'13px',color:'var(--tx-s)',lineHeight:1.6,marginBottom:14}}>La suppression de votre compte est <strong>définitive et irréversible</strong>. Toutes vos données de consommation, alertes et paramètres seront effacées.</p>
            <button className="btn-danger" onClick={()=>setDelModal(true)}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{display:'inline-block',verticalAlign:'middle',marginRight:6}}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              Supprimer mon compte
            </button>
          </div>
        </div>}

      </div>
    </div>

    {/* ── Confirm delete modal ── */}
    {delModal&&<div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setDelModal(false);}}>
      <div className="modal">
        <div className="modal-title">Supprimer le compte ?</div>
        <div className="modal-body">
          Cette action est <strong>définitive et irréversible</strong>. Votre compte, vos données de consommation et vos configurations d'alertes seront supprimés définitivement.<br/><br/>
          Entrez votre mot de passe pour confirmer.
        </div>
        <div className="fg" style={{marginBottom:16}}>
          <label className="fl">Mot de passe de confirmation</label>
          <input type="password" className="fi" placeholder="Votre mot de passe actuel"/>
        </div>
        <div className="modal-actions">
          <button className="btn-cancel" onClick={()=>setDelModal(false)}>Annuler</button>
          <button className="btn-danger" onClick={()=>setDelModal(false)}>Confirmer la suppression</button>
        </div>
      </div>
    </div>}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
