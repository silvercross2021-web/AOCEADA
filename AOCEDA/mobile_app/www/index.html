<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AOCEDA02.05</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      padding-top: calc(20px + var(--safe-top));
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      z-index: 10;
    }

    .logo-container {
      margin-bottom: 30px;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo {
      max-width: 180px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(13, 110, 253, 0.3));
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.8s ease-out;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 12px;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Modal / Formulaire configuration */
    .config-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .config-modal.active {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: left;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      margin-bottom: 15px;
    }

    .status-badge.loading {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ambient background glows */
    .glow-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13, 110, 253, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0,0,0,0) 70%);
      bottom: -100px;
      right: -100px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <!-- Logo seul, sans carte ni texte : lu comme un écran de démarrage natif, pas
         comme une « page en cours de chargement ». La vérification de connexion se
         fait en silence derrière ; seul un échec réel affiche quelque chose de plus. -->
    <div class="logo-container">
      <img src="aoceda-full.png" alt="AOCEDA" class="logo" onerror="this.src='aoceda-icon.png'">
    </div>

    <!-- ÉCRAN D'ERREUR HORS LIGNE (seul état visible autre que le logo — cas réel d'échec) -->
    <div id="offline-view" class="card" style="display: none;">
      <span class="status-badge">Serveur inaccessible</span>
      <h2>AOCEDA est hors ligne</h2>
      <p>Impossible de joindre le serveur. Assurez-vous que le serveur Django est bien démarré sur votre PC et que votre téléphone est connecté au même réseau Wi-Fi.</p>
      <p id="current-url-display" style="font-size: 0.8rem; font-family: monospace; word-break: break-all; margin-top: -10px; margin-bottom: 24px; color: var(--text-muted);"></p>

      <button class="btn btn-primary" onclick="checkConnection()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
        Réessayer la connexion
      </button>

      <button class="btn btn-secondary" onclick="openConfig()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.99l1.005.831a1.125 1.125 0 01.26 1.43l-1.297 2.247a1.125 1.125 0 01-1.37.491l-1.216-.456c-.356-.133-.751-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.004-.83c.292-.24.437-.613.43-.991a6.936 6.936 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.83a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.645-.869L9.594 3.94z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Paramètres de connexion
      </button>
    </div>
  </div>

  <!-- MODAL DE CONFIGURATION IP/PORT -->
  <div id="config-modal" class="config-modal">
    <div class="modal-content">
      <div class="modal-title">Configuration Connexion</div>
      
      <div class="form-group">
        <label for="ip-input">Adresse IP du PC</label>
        <input type="text" id="ip-input" placeholder="Ex: 10.112.53.194">
      </div>

      <div class="form-group">
        <label for="port-input">Port de Django</label>
        <input type="text" id="port-input" placeholder="Ex: 8003">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeConfig()">Annuler</button>
        <button class="btn btn-primary" onclick="saveConfig()">Appliquer</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_IP = "10.54.184.195";
    const DEFAULT_PORT = "8003";

    function getServerConfig() {
      let ip = localStorage.getItem("aoceda_server_ip") || DEFAULT_IP;
      let port = localStorage.getItem("aoceda_server_port") || DEFAULT_PORT;
      return { ip, port };
    }

    function buildUrl(ip, port) {
      return `http://${ip.trim()}:${port.trim()}`;
    }

    function showView(viewId) {
      // "loading" = juste le logo (déjà à l'écran, rien à faire) ; seule "offline" a
      // un vrai contenu à afficher/masquer.
      document.getElementById("offline-view").style.display = viewId === "offline" ? "block" : "none";
    }

    function checkConnection() {
      showView("loading");
      const config = getServerConfig();
      const baseUrl = buildUrl(config.ip, config.port);

      document.getElementById("current-url-display").innerText = `Serveur cible : ${baseUrl}`;

      const img = new Image();
      let hasResponded = false;

      // Fenêtre de tolérance avant d'afficher un échec réel — sur un Wi-Fi local ça
      // répond en général en quelques dizaines de ms, donc ce délai n'est quasiment
      // jamais perçu par l'utilisateur (juste le logo, pas d'étape "chargement" visible).
      const timeoutId = setTimeout(() => {
        if (!hasResponded) {
          hasResponded = true;
          img.src = ""; // Stop loading
          showView("offline");
        }
      }, 4000);

      img.onload = () => {
        if (!hasResponded) {
          hasResponded = true;
          clearTimeout(timeoutId);
          redirectAfterConnection(baseUrl);
        }
      };

      img.onerror = () => {
        // En cas de redirection ou de chargement de l'image (ex: code 302/404),
        // si le serveur a répondu, c'est qu'il est en ligne !
        if (!hasResponded) {
          hasResponded = true;
          clearTimeout(timeoutId);
          redirectAfterConnection(baseUrl);
        }
      };

      // Tente de charger le favicon pour vérifier la présence du serveur (CORS-immune)
      img.src = `${baseUrl}/favicon.ico?t=${Date.now()}`;
    }

    // Après confirmation que le serveur répond : si une session est DÉJÀ enregistrée dans
    // le stockage natif de l'app (SharedPreferences, voir MainActivity.java → survit au
    // redémarrage de l'app ET à un changement d'IP LAN, contrairement au localStorage qui
    // est scopé par origine), on va DIRECTEMENT à l'espace de l'utilisateur, comme une
    // vraie app mobile — jamais réafficher le formulaire de connexion. La page de
    // destination réhydrate elle-même ses jetons depuis ce même store (client-shell.js).
    // Repli : /auth/, qui refait la même vérification (deuxième point de restauration).
    function redirectAfterConnection(baseUrl) {
      try {
        if (window.AndroidTokenStore) {
          var access = window.AndroidTokenStore.getAccess();
          var refresh = window.AndroidTokenStore.getRefresh();
          if (access || refresh) {
            var role = window.AndroidTokenStore.getRole();
            window.location.href = baseUrl + (role === 'technicien' ? '/technicien/' : '/dashboard/');
            return;
          }
        }
      } catch (e) {}
      window.location.href = baseUrl + '/auth/';
    }

    function openConfig() {
      const config = getServerConfig();
      document.getElementById("ip-input").value = config.ip;
      document.getElementById("port-input").value = config.port;
      document.getElementById("config-modal").classList.add("active");
    }

    function closeConfig() {
      document.getElementById("config-modal").classList.remove("active");
    }

    function saveConfig() {
      const ip = document.getElementById("ip-input").value.trim();
      const port = document.getElementById("port-input").value.trim();

      if (!ip || !port) {
        alert("Veuillez remplir les deux champs.");
        return;
      }

      localStorage.setItem("aoceda_server_ip", ip);
      localStorage.setItem("aoceda_server_port", port);
      
      closeConfig();
      checkConnection();
    }

    // Vérification lancée immédiatement (pas de délai artificiel) : sur un Wi-Fi local
    // ça reste imperceptible, contrairement à l'ancien écran "Initialisation..." fixe.
    window.addEventListener("DOMContentLoaded", checkConnection);
  </script>
</body>
</html>
