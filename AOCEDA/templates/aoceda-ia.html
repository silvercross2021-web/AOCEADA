{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <script>
    /* Anti-flash : applique le thème AVANT le premier rendu (évite l'éclair blanc).
       Par défaut (aucun choix figé) = suit le thème du SYSTÈME de l'utilisateur. */
    (function(){var c=localStorage.getItem('aoceda-theme-choice')||'auto';
      var t=(c==='light'||c==='dark')?c:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
      document.documentElement.setAttribute('data-theme',t);
      document.documentElement.style.backgroundColor=(t==='dark'?'#000000':'#F4F5F7');
      localStorage.setItem('aoceda-theme',t);})();
  </script>
  <title>Assistant AOCEDA · Conseils Énergie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/client-shell.css' %}?v=22">
  <link rel="stylesheet" href="{% static 'css/refonte-shell.css' %}?v=11">
  <link rel="stylesheet" href="{% static 'css/refonte-theme.css' %}?v=8">
  <style>
    /* L'assistant (chatbot) occupe toute la zone de contenu : sa page est dans un cadre (/ia/assistant/), ses styles
       ne touchent jamais au menu. Sur mobile, il s'arrête au-dessus de la barre du bas. */
    .content.assistant-page{padding:0;overflow:hidden;display:flex;position:relative}
    .assistant-cadre{flex:1;width:100%;height:100%;border:0;display:block;background:transparent}
    @media(max-width:768px){ .content.assistant-page{padding:0 0 calc(58px + env(safe-area-inset-bottom, 0px))} }
    /* Mode Plein Écran de l'assistant */
    .app.assistant-plein-ecran, body.assistant-plein-ecran{overflow:hidden!important}
    .app.assistant-plein-ecran .content.assistant-page{
      position:fixed!important;inset:0!important;z-index:99999!important;
      width:100vw!important;height:100vh!important;margin:0!important;padding:0!important;
      background:var(--rf-surface,#ffffff);
    }
    .app.assistant-plein-ecran .assistant-cadre{width:100%!important;height:100%!important}
    .bouton-quitter-plein-ecran{
      position:fixed;top:14px;right:14px;z-index:100000;display:none;align-items:center;gap:8px;
      height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--bd-d,#d5dbe2);
      background:var(--surface,#ffffff);color:var(--texte,#16212e);font-size:13.5px;font-weight:600;
      box-shadow:0 4px 16px rgba(0,0,0,0.15);cursor:pointer;transition:transform .15s,background .15s;
    }
    .bouton-quitter-plein-ecran:hover{background:var(--bg-h,rgba(20,55,90,.06))}
    .bouton-quitter-plein-ecran:active{transform:scale(.96)}
    .bouton-quitter-plein-ecran svg{width:16px;height:16px;stroke:currentColor;fill:none}
    .app.assistant-plein-ecran .bouton-quitter-plein-ecran{display:inline-flex}
    [data-theme="dark"] .bouton-quitter-plein-ecran{background:#1c1c1e;color:#f2f2f7;border-color:rgba(255,255,255,.18)}
    /* Outils de l'assistant dans l'en-tête (même dessin que dans la page de l'assistant), à la place de la recherche */
    .assistant-outils{display:flex;align-items:center;margin-right:auto;min-width:0}
    .assistant-outil{display:inline-flex;align-items:center;gap:12px;height:44px;padding:0 8px;border:0;border-radius:12px;
      background:none;color:var(--rf-navy,var(--tx-p));font:500 15px/1 var(--fb,inherit);letter-spacing:.005em;cursor:pointer;
      transition:background .15s,transform .15s;white-space:nowrap}
    .assistant-outil svg{width:23px;height:23px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .assistant-outil .cercle{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd-d,#d5dbe2);display:grid;place-items:center;flex:none}
    .assistant-outil .cercle svg{width:16px;height:16px;stroke-width:1.7}
    .assistant-outil:hover{background:var(--bg-h,rgba(20,55,90,.06))}
    .assistant-outil:active{transform:scale(.97)}
    .assistant-sep{width:1px;height:28px;background:var(--rf-line,var(--bd-s));margin:0 18px;flex:none}
    [data-theme="dark"] .assistant-outil{color:var(--tx-p)}
    [data-theme="dark"] .assistant-outil .cercle{border-color:var(--bd-s)}
    @media(max-width:768px){                 /* téléphone : les icônes seules */
      .assistant-outils{gap:2px}
      .assistant-outil{padding:0 7px;height:40px}
      .assistant-outil .mot,.assistant-sep{display:none}
    }
  </style>
  <script src="{% static 'js/refonte-shell.js' %}?v=3" defer></script>
  <script src="{% static 'js/i18n.js' %}?v=3"></script><script src="{% static 'js/client-shell.js' %}?v=28" defer></script>
  <script src="{% static 'js/assistant-page.js' %}?v=3" defer></script>
</head>
<body>
<div class="app">

  <!-- ── Sidebar commune ── -->
  {% include 'partials/_sidebar_client.html' %}

  <!-- ── Main ── -->
  <div class="main">
    <header class="header">
      <h1 class="hdr-title sr-only">Assistant AOCEDA</h1>
      <!-- Outils de l'assistant (à la place de la recherche) : ils actionnent les boutons de la page de l'assistant
           (cadre ci-dessous, js/assistant-page.js) ; data-assistant = id du bouton correspondant dans le cadre. -->
      <div class="assistant-outils" role="toolbar" aria-label="Assistant AOCEDA">
        <button class="assistant-outil" type="button" data-assistant="nouvelle" id="btn_hdr_nouvelle" title="Nouvelle conversation" aria-label="Nouvelle conversation"><span class="cercle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="mot">Nouvelle</span></button>
        <span class="assistant-sep" aria-hidden="true"></span>
        <button class="assistant-outil" type="button" data-assistant="historique" id="btn_hdr_historique" title="Historique des conversations" aria-label="Historique des conversations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.8v4.7h4.7"/><path d="M12 7.5V12l3.2 2.2"/></svg><span class="mot">Historique</span></button>
        <span class="assistant-sep" aria-hidden="true"></span>
        <button class="assistant-outil" type="button" data-assistant="options" id="btn_hdr_options" title="Options de l'assistant" aria-label="Options de l'assistant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="mot">Options</span></button>
        <span class="assistant-sep" aria-hidden="true"></span>
        <button class="assistant-outil" type="button" data-assistant="credits" id="btn_hdr_credits" title="Crédits des services" aria-label="Crédits des services"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg><span class="mot">Crédits</span></button>
        <span class="assistant-sep" aria-hidden="true"></span>
        <button class="assistant-outil" type="button" data-assistant="plein_ecran" id="btn_plein_ecran" title="Plein écran" aria-label="Basculer en plein écran" aria-pressed="false"><span class="cercle"><svg class="ic-agrandir" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg><svg class="ic-reduire" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></span><span class="mot">Plein écran</span></button>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn notif-btn" id="notif-btn" aria-label="Voir les alertes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <div class="notif-dot" id="notif-dot" style="display:none"></div>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="hdr-user-chip" id="hdr-user-chip">?</div>
      </div>
    </header>
    <main class="content assistant-page" id="assistant-page-cadre">
      <button class="bouton-quitter-plein-ecran" id="btn_quitter_plein_ecran" type="button" aria-label="Quitter le plein écran" title="Quitter le plein écran">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
        <span>Quitter le plein écran (Échap)</span>
      </button>
      <!-- L'assistant AOCEDA (chatbot) : chat écrit et vocal, dioula, baoulé et wolof, appel Live. Micro, caméra et partage
           d'écran autorisés pour lui (appel Live : « montrez-moi votre compteur »). -->
      <iframe class="assistant-cadre" id="assistant-cadre" src="{% url 'dashboard:assistant' %}" title="Assistant AOCEDA"
              allow="microphone; camera; display-capture; autoplay; fullscreen; clipboard-write"></iframe>
    </main>
  </div>

  {% include 'partials/_bottom_nav_client.html' with show_fab=False %}

</div>
</body>
</html>
