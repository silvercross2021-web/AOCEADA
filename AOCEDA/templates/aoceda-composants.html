<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AOCEDA · Composants & États</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root{
      --e2:#FAD08F;--e3:#F7B558;--e5:#C9760E;--e6:#A05808;
      --c5:#1B7A6E;
      --s50:#F4F5F7;--s100:#F5F0E8;--s200:#E8DDD0;--s300:#D4C5B0;
      --s400:#BAAB92;--s600:#7A6854;--s900:#221C14;
      --err:#D93025;--warn:#D97700;--ok:#1B7A50;--info:#1B5A8A;
      --bg-p:var(--s50);--bg-s:#FFF;--bg-h:var(--s100);--bg-a:var(--s200);
      --tx-p:var(--s900);--tx-s:var(--s600);--tx-m:var(--s400);
      --bd-s:var(--s200);--bd-d:var(--s300);
      --ac:var(--e5);--ac-h:var(--e6);
      --fd:'Hanken Grotesk',system-ui,sans-serif;
      --fb:'Hanken Grotesk',system-ui,sans-serif;
      --ts:300ms ease;--tb:200ms ease;
      --sh:0 1px 3px rgba(34,28,20,.07);
    }
    [data-theme="dark"]{
      --bg-p:#000000;--bg-s:#161C26;--bg-h:rgba(255,255,255,.05);--bg-a:rgba(255,255,255,.08);
      --tx-p:#E8E2D8;--tx-s:#9C8870;--tx-m:#8E7F69;
      --bd-s:rgba(255,255,255,.06);--bd-d:rgba(255,255,255,.10);
      --ac:var(--e3);--ac-h:var(--e2);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{min-height:100%}
    body{font-family:var(--fb);background:var(--bg-p);color:var(--tx-p);-webkit-font-smoothing:antialiased;transition:background var(--ts),color var(--ts)}

    .topbar{display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;background:var(--bg-s);border-bottom:1px solid var(--bd-s);position:sticky;top:0;z-index:20;transition:background var(--ts)}
    .back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx-s);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:6px;font-family:var(--fb);text-decoration:none;transition:all var(--tb)}
    .back-btn:hover{background:var(--bg-h);color:var(--tx-p)}
    .sep{width:1px;height:20px;background:var(--bd-s)}
    .topbar-title{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--tx-p)}
    .topbar-right{margin-left:auto;display:flex;gap:8px}
    .icon-btn{width:34px;height:34px;border-radius:7px;background:var(--bg-h);border:1px solid var(--bd-s);color:var(--tx-s);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tb)}
    .icon-btn:hover{background:var(--bg-a);color:var(--tx-p)}

    /* Tabs */
    .tab-bar{background:var(--bg-s);border-bottom:1px solid var(--bd-s);padding:0 24px;display:flex;gap:4px;position:sticky;top:56px;z-index:10;transition:background var(--ts);overflow-x:auto}
    .tab-btn{padding:13px 16px;border:none;background:none;font-family:var(--fb);font-size:13px;font-weight:500;color:var(--tx-s);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--tb);white-space:nowrap}
    .tab-btn.active{color:var(--ac);border-bottom-color:var(--ac)}
    .tab-btn:hover:not(.active){color:var(--tx-p)}

    .content{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:768px){.grid-2{grid-template-columns:1fr}}
    .card{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:12px;padding:22px 24px;box-shadow:var(--sh);transition:background var(--ts)}
    .card-title{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--tx-p);margin-bottom:4px}
    .card-sub{font-size:12px;color:var(--tx-s);margin-bottom:18px;line-height:1.5}

    /* ── Skeleton ── */
    @keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
    .skeleton{border-radius:6px;background:linear-gradient(90deg,var(--bd-s) 0%,var(--bg-h) 40%,var(--bd-s) 80%);background-size:600px 100%;animation:shimmer 1.4s ease infinite}
    .sk-title{height:18px;width:55%;margin-bottom:8px}
    .sk-text{height:12px;margin-bottom:6px}
    .sk-text.w80{width:80%}.sk-text.w60{width:60%}.sk-text.w90{width:90%}
    .sk-rect{height:100%;width:100%}
    .sk-circle{border-radius:50%}
    .sk-card-kpi{height:88px}
    .sk-chart{height:180px}
    .sk-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}

    /* ── Empty states ── */
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;text-align:center}
    .empty-ico{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    .empty-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--tx-p);margin-bottom:8px}
    .empty-sub{font-size:14px;color:var(--tx-s);line-height:1.65;max-width:340px;margin:0 auto 24px}
    .btn-primary{height:42px;padding:0 22px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tb)}
    .btn-primary:hover{background:var(--ac-h);transform:translateY(-1px)}

    /* ── Error states ── */
    .err-page{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
    .err-code{font-family:var(--fd);font-size:80px;font-weight:700;line-height:1;letter-spacing:-3px;margin-bottom:8px}
    .err-title{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--tx-p);margin-bottom:10px}
    .err-sub{font-size:14px;color:var(--tx-s);line-height:1.65;max-width:380px;margin:0 auto 24px}
    .btn-ghost{height:40px;padding:0 20px;background:transparent;border:1.5px solid var(--bd-d);border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:500;color:var(--tx-s);cursor:pointer;transition:all var(--tb);margin:0 5px}
    .btn-ghost:hover{background:var(--bg-h);color:var(--tx-p)}

    /* ── Toasts ── */
    .toasts-wrapper{position:relative;height:220px;overflow:hidden;border-radius:10px;background:var(--bg-h);border:1px solid var(--bd-s);padding:16px}
    .toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;margin-bottom:10px;border:1px solid transparent;max-width:380px}
    .toast-err{background:var(--bg-s);border-color:rgba(217,48,37,.25)}
    .toast-warn{background:var(--bg-s);border-color:rgba(217,119,0,.25)}
    .toast-ok{background:var(--bg-s);border-color:rgba(27,122,80,.25)}
    .toast-ico{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .ti-err{background:rgba(217,48,37,.15);color:var(--err)}
    .ti-warn{background:rgba(217,119,0,.15);color:var(--warn)}
    .ti-ok{background:rgba(27,122,80,.15);color:var(--ok)}
    .toast-body .t-title{font-weight:600;color:var(--tx-p);margin-bottom:2px}
    .toast-body .t-sub{color:var(--tx-s);font-size:12px}
    .toast-close{margin-left:auto;color:var(--tx-m);background:none;border:none;cursor:pointer;padding:2px;font-size:16px;line-height:1;flex-shrink:0}

    /* ── Notification panel ── */
    .notif-panel{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
    .np-header{padding:14px 18px;border-bottom:1px solid var(--bd-s);display:flex;align-items:center;justify-content:space-between}
    .np-title{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--tx-p)}
    .mark-all{font-size:12px;color:var(--ac);background:none;border:none;cursor:pointer;font-family:var(--fb)}
    .mark-all:hover{text-decoration:underline}
    .notif-item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:1px solid var(--bd-s);transition:all var(--tb)}
    .notif-item:last-child{border-bottom:none}
    .notif-item:hover{background:var(--bg-h)}
    .notif-item.unread{background:rgba(201,118,14,.04)}
    [data-theme="dark"] .notif-item.unread{background:rgba(247,181,88,.03)}
    .notif-unread-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
    .notif-msg{flex:1;font-size:13px;color:var(--tx-p);line-height:1.5}
    .notif-time{font-size:11px;color:var(--tx-m);white-space:nowrap;margin-left:8px;margin-top:2px}

    /* ── Offline banner ── */
    .offline-banner{background:rgba(217,119,0,.09);border:1px solid rgba(217,119,0,.25);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx-p)}
    .offline-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0;animation:blink 1.5s step-end infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── Push notif mockup ── */
    .push-notif{background:linear-gradient(145deg,#1C2535,#0D1624);border-radius:16px;padding:14px 16px;color:#fff;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
    .pn-app{display:flex;align-items:center;gap:8px;margin-bottom:10px;opacity:.65;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    .pn-icon{width:24px;height:24px;border-radius:6px;background:#C9760E;display:flex;align-items:center;justify-content:center}
    .pn-title{font-size:14px;font-weight:700;margin-bottom:4px}
    .pn-body{font-size:13px;opacity:.75;line-height:1.5}
    .pn-time{font-size:11px;opacity:.45;margin-top:8px}
    .pn-actions{display:flex;gap:8px;margin-top:12px}
    .pn-btn{flex:1;height:32px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
    .pn-btn-dismiss{background:rgba(255,255,255,.12);color:#fff}
    .pn-btn-view{background:#C9760E;color:#fff}

    /* ── Password change (first login) ── */
    .fl-wrap{max-width:420px;margin:0 auto;padding:32px 0}
    .fl-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(27,122,80,.10);border:1px solid rgba(27,122,80,.22);font-size:11px;font-weight:700;color:var(--ok);font-family:var(--fd);letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px}
    .rules{margin-top:8px;display:flex;flex-direction:column;gap:3px}
    .rule{font-size:12px;color:var(--tx-s);display:flex;align-items:center;gap:6px}
    .rule.v{color:var(--ok)}
    .pwd-bars{display:flex;gap:3px}
    .pbar{height:3px;flex:1;border-radius:2px;transition:background 200ms}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sp{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
  </style>
</head>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

function Logo({s=26}){return<svg width={s} height={s} viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#F5A623"/><path d="M5 18H10L13.5 9L17.5 27L21 14L24 22L27 18H31" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;}

/* ════ SKELETON SCREENS ════ */

/* ════ EMPTY STATES ════ */
function EmptySensor(){
  return<div className="empty-state">
    <div className="empty-ico" style={{background:'rgba(201,118,14,.10)'}}>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C9760E" strokeWidth="1.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>

    <div className="empty-title">Aucun capteur configuré</div>

    <div style={{display:'flex',gap:10,flexWrap:'wrap',justifyContent:'center'}}>
      <button className="btn-primary">Contacter un technicien</button>
      <button className="btn-ghost" style={{height:42}}>En savoir plus</button>
    </div>
  </div>;
}

function EmptyAlerts(){
  return<div className="empty-state">
    <div className="empty-ico" style={{background:'rgba(27,122,80,.09)'}}>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B7A50" strokeWidth="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

function EmptyHistory(){
  return<div className="empty-state">
    <div className="empty-ico" style={{background:'rgba(27,90,138,.09)'}}>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B5A8A" strokeWidth="1.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </div>
    <div className="empty-title">Aucune donnée disponible</div>

  </div>;

/* ════ ERROR STATES ════ */
function Error404(){
  return<div className="err-page">
    <div className="err-code" style={{background:'linear-gradient(135deg,var(--e5),var(--c5))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>404</div>
    <div className="err-title">Page introuvable</div>
    <div className="err-sub">La page que vous recherchez n'existe pas ou a été déplacée. Vérifiez l'URL ou retournez au tableau de bord.</div>
    <div style={{display:'flex',gap:8}}>
      <a href="aoceda-dashboard.html" className="btn-primary" style={{textDecoration:'none',display:'inline-flex',alignItems:'center',height:42,padding:'0 22px',borderRadius:8,fontSize:'13px',fontWeight:600,background:'var(--ac)',color:'#fff'}}>Tableau de bord</a>
      <button className="btn-ghost">Retour</button>
    </div>

}

function Error500(){
  return<div className="err-page">
    <div className="err-code" style={{color:'var(--err)',opacity:.18,fontSize:80,fontFamily:'var(--fd)',fontWeight:700,letterSpacing:-3,lineHeight:1,position:'relative'}}>
      <span style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',fontSize:80,opacity:1,color:'var(--err)'}}>500</span>
      <span style={{visibility:'hidden'}}>500</span>
    </div>
    <div style={{marginBottom:8}}>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--err)" strokeWidth="1.2" style={{margin:'0 auto'}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div className="err-title">Serveur indisponible</div>
    <div className="err-sub">Un problème est survenu de notre côté. Nos équipes sont informées et travaillent à résoudre le problème. Veuillez réessayer dans quelques minutes.</div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
      <button className="btn-primary" onClick={()=>{}}>Réessayer</button>
      <button className="btn-ghost">Voir le statut système</button>
    </div>
  </div>;
}

/* ════ OFFLINE BANNER ════ */
function OfflineBanner(){
  const [show,setShow]=useState(true);
  if(!show)return<button className="btn-ghost" style={{width:'100%',height:40}} onClick={()=>setShow(true)}>Ré-afficher la bannière hors-ligne</button>;
  return<div className="offline-banner">
    <div className="offline-dot"/>
    <div style={{flex:1}}>
      <span style={{fontWeight:600,color:'var(--warn)'}}>Mode hors-ligne</span>
      {' '}— Données en cache · Dernière synchronisation il y a 2h14 · Reconnexion automatique en cours…
    </div>
    <button className="btn-ghost" style={{height:30,padding:'0 12px',fontSize:'12px'}} onClick={()=>setShow(false)}>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>;
}

/* ════ TOASTS ════ */
function ToastSection(){
  const [toasts,setToasts]=useState([
    {id:1,type:'err',title:'⚡ Dépassement seuil, 2 340 W',sub:'Capteur 1 · Salon/Cuisine · il y a 3 min',read:false},
    {id:2,type:'warn',title:'💳 Crédit prépayé bas',sub:'Crédit estimé : 8 450 FCFA · il y a 23 min',read:false},
    {id:3,type:'ok',title:'✓ Email de rapport envoyé',sub:'Rapport mensuel mai 2026 · il y a 1h',read:false},
  ]);
  const dismiss=id=>setToasts(t=>t.filter(x=>x.id!==id));
  const add=()=>{
    const types=['err','warn','ok'];
    const msgs=[{title:'⚡ Nouveau pic de consommation',sub:'2 800 W détectés · Capteur 1'},
                {title:'📊 Rapport généré',sub:'Historique 30 jours disponible'},
                {title:'⚠ Synchronisation différée',sub:'Délai de 8 minutes sur Capteur 2'}];
    const t=types[Math.floor(Math.random()*3)];
    const m=msgs[Math.floor(Math.random()*3)];
    setToasts(prev=>[...prev,{id:Date.now(),type:t,...m,read:false}]);
  };
  const typeClass={err:'toast-err',warn:'toast-warn',ok:'toast-ok'};
  const icoClass={err:'ti-err',warn:'ti-warn',ok:'ti-ok'};
  const icoSvg={
    err:<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>,
    warn:<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>,
    ok:<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>,
  };
  return<>
    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
      <button className="btn-primary" style={{height:34,padding:'0 14px',fontSize:'12px'}} onClick={add}>+ Ajouter un toast</button>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:8,minHeight:80}}>
      {toasts.length===0&&<div style={{textAlign:'center',color:'var(--tx-m)',fontSize:'13px',padding:'20px 0'}}>Tous les toasts ont été fermés. Cliquez sur "+" pour en ajouter.</div>}
      {toasts.map(t=><div key={t.id} className={`toast ${typeClass[t.type]}`}>
        <div className={`toast-ico ${icoClass[t.type]}`}>{icoSvg[t.type]}</div>
        <div className="toast-body"><div className="t-title">{t.title}</div><div className="t-sub">{t.sub}</div></div>
        <button className="toast-close" onClick={()=>dismiss(t.id)}>×</button>
      </div>)}
    </div>
  </>;
}

/* ════ NOTIFICATIONS PANEL ════ */
function NotifPanel(){
  const [notifs,setNotifs]=useState([
    {id:1,msg:'⚡ Dépassement seuil, 2 340 W détectés sur Capteur 1 (seuil : 2 000 W)',time:'14h32',unread:true},
    {id:2,msg:'💳 Crédit prépayé bas, Crédit estimé sous 10 000 FCFA',time:'11h15',unread:true},
    {id:3,msg:'📊 Rapport mensuel disponible, Mai 2026 (142 kWh · 23 490 FCFA)',time:'09h00',unread:false},
    {id:4,msg:'✓ Calibration réussie, Capteur 1 · Kcal : 0,982 · Écart : 0,4%',time:'Hier 14h20',unread:false},
    {id:5,msg:'📱 Nouveau dispositif enregistré, ESP32-WR-2407 (Konaté Adjoua)',time:'Il y a 3j',unread:false},
  ]);
  const markAll=()=>setNotifs(n=>n.map(x=>({...x,unread:false})));
  const unread=notifs.filter(n=>n.unread).length;
  return<div className="notif-panel">
    <div className="np-header">
      <div className="np-title">Notifications {unread>0&&<span style={{background:'var(--err)',color:'#fff',fontSize:'10px',fontWeight:700,padding:'1px 6px',borderRadius:'10px',marginLeft:6,fontFamily:'var(--fd)'}}>{unread}</span>}</div>
      {unread>0&&<button className="mark-all" onClick={markAll}>Tout marquer comme lu</button>}
    </div>
    {notifs.map(n=><div key={n.id} className={`notif-item${n.unread?' unread':''}`}>
      <div className="notif-unread-dot" style={{background:n.unread?'var(--ac)':'transparent',flexShrink:0,marginTop:4}}/>
      <div className="notif-msg">{n.msg}</div>
      <div className="notif-time">{n.time}</div>
    </div>)}
  </div>;
}

/* ════ PUSH NOTIFICATION MOCKUP ════ */
function PushMockup(){
  return<div className="push-notif">
    <div className="pn-app">
      <div className="pn-icon"><svg width="14" height="14" viewBox="0 0 36 36" fill="none"><path d="M5 18H10L13.5 9L17.5 27L21 14L24 22L27 18H31" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
      AOCEDA · Maintenant
    </div>
    <div className="pn-title">⚡ Dépassement de seuil détecté</div>
    <div className="pn-body">2 340 W détectés sur Capteur 1 (Salon/Cuisine) à 14h32. Seuil configuré : 2 000 W. Vérifiez vos appareils.</div>
    <div className="pn-time">14:32 · Cocody, Abidjan</div>
    <div className="pn-actions">
      <button className="pn-btn pn-btn-dismiss">Ignorer</button>
      <button className="pn-btn pn-btn-view">Voir dans AOCEDA →</button>
    </div>
  </div>;
}

/* ════ FIRST LOGIN (Technicien) ════ */
function FirstLogin(){
  const [oldPwd,setOldPwd]=useState('');
  const [newPwd,setNewPwd]=useState('');
  const [confirm,setConfirm]=useState('');
  const [loading,setLoading]=useState(false);
  const [done,setDone]=useState(false);
  const score=(p)=>{let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;return s;};
  const s=score(newPwd);
  const cols=['','#D93025','#E8920A','#D97700','#1B7A6E','#1B7A50'];
  const rules=[{txt:'Minimum 8 caractères',ok:newPwd.length>=8},{txt:'Au moins 1 majuscule',ok:/[A-Z]/.test(newPwd)},{txt:'Au moins 1 chiffre',ok:/[0-9]/.test(newPwd)}];
  const submit=e=>{e.preventDefault();setLoading(true);setTimeout(()=>{setLoading(false);setDone(true);},1500);};
  if(done)return<div className="fl-wrap">
    <div style={{textAlign:'center',padding:'32px 0'}}>
      <div style={{width:60,height:60,borderRadius:'50%',background:'rgba(27,122,80,.10)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',color:'var(--ok)'}}>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style={{fontFamily:'var(--fd)',fontSize:'20px',fontWeight:700,color:'var(--tx-p)',marginBottom:8}}>Mot de passe mis à jour</div>
      <div style={{fontSize:'14px',color:'var(--tx-s)',lineHeight:1.6,marginBottom:24}}>Votre compte technicien est sécurisé. Vous allez être redirigé vers votre espace.</div>
      <a href="aoceda-technicien.html" style={{display:'inline-flex',alignItems:'center',height:42,padding:'0 22px',borderRadius:8,fontSize:'13px',fontWeight:600,background:'var(--ac)',color:'#fff',textDecoration:'none'}}>Accéder à mon espace →</a>
    </div>
  </div>;
  return<div className="fl-wrap">
    <div className="fl-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Première connexion
    </div>
    <div style={{fontFamily:'var(--fd)',fontSize:'22px',fontWeight:700,color:'var(--tx-p)',marginBottom:8,letterSpacing:'-.3px'}}>Changer votre mot de passe temporaire</div>
    <div style={{fontSize:'14px',color:'var(--tx-s)',lineHeight:1.65,marginBottom:24}}>Pour des raisons de sécurité, vous devez choisir un nouveau mot de passe avant d'accéder à votre espace technicien.</div>
    <form onSubmit={submit}>
      <div style={{marginBottom:14}}>
        <label style={{display:'block',fontSize:'12px',fontWeight:600,color:'var(--tx-p)',marginBottom:5}}>Mot de passe temporaire</label>
        <input type="password" value={oldPwd} onChange={e=>setOldPwd(e.target.value)} placeholder="Reçu par email" style={{width:'100%',height:42,padding:'0 12px',background:'var(--bg-p)',border:'1.5px solid var(--bd-d)',borderRadius:8,fontFamily:'var(--fb)',fontSize:14,color:'var(--tx-p)',outline:'none'}}/>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{display:'block',fontSize:'12px',fontWeight:600,color:'var(--tx-p)',marginBottom:5}}>Nouveau mot de passe</label>
        <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Minimum 8 caractères" style={{width:'100%',height:42,padding:'0 12px',background:'var(--bg-p)',border:'1.5px solid var(--bd-d)',borderRadius:8,fontFamily:'var(--fb)',fontSize:14,color:'var(--tx-p)',outline:'none'}}/>
        {newPwd&&<div style={{display:'flex',alignItems:'center',gap:8,marginTop:8}}>
          <div className="pwd-bars">{[1,2,3,4,5].map(i=><div key={i} className="pbar" style={{background:i<=s?cols[s]:'var(--bd-s)'}}/>)}</div>
          <span style={{fontSize:'11px',fontWeight:600,color:cols[s],whiteSpace:'nowrap'}}>{['','Très faible','Faible','Moyen','Fort','Très fort'][s]}</span>
        </div>}
        <div className="rules">{rules.map((r,i)=><div key={i} className={`rule${r.ok?' v':''}`}>
          {r.ok?<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>}
          {r.txt}
        </div>)}</div>
      </div>
      <div style={{marginBottom:20}}>
        <label style={{display:'block',fontSize:'12px',fontWeight:600,color:'var(--tx-p)',marginBottom:5}}>Confirmer le nouveau mot de passe</label>
        <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="Répétez le mot de passe" style={{width:'100%',height:42,padding:'0 12px',background:'var(--bg-p)',border:`1.5px solid ${confirm&&confirm!==newPwd?'var(--err)':'var(--bd-d)'}`,borderRadius:8,fontFamily:'var(--fb)',fontSize:14,color:'var(--tx-p)',outline:'none'}}/>
        {confirm&&confirm!==newPwd&&<div style={{fontSize:'12px',color:'var(--err)',marginTop:4}}>Les mots de passe ne correspondent pas</div>}
      </div>
      <button type="submit" disabled={loading||!oldPwd||!newPwd||newPwd!==confirm||newPwd.length<8} style={{width:'100%',height:44,background:'var(--ac)',color:'#fff',border:'none',borderRadius:8,fontFamily:'var(--fb)',fontSize:'14px',fontWeight:700,cursor:'pointer',opacity:loading||!oldPwd||!newPwd||newPwd!==confirm||newPwd.length<8?.55:1,transition:'all .2s'}}>
        {loading?<><span className="sp"/>Mise à jour…</>:'Confirmer le changement de mot de passe'}
      </button>
    </form>
  </div>;
}

/* ════ APP ════ */
function App(){
  const [theme,setTheme]=useState(()=>localStorage.getItem('aoceda-theme')||'light');
  const [tab,setTab]=useState('skeleton');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('aoceda-theme',theme);},[theme]);

  const TABS=[['skeleton','Squelettes de chargement'],['empty','États vides'],['errors','Pages d\'erreur'],['offline','Mode hors-ligne'],['toasts','Toasts & Alertes'],['notifs','Panneau notifications'],['push','Notification push'],['firstlogin','Première connexion']];

  return<>
    <div className="topbar">
      <a href="index.html" className="back-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>Accueil</a>
      <div className="sep"/>
      <span className="topbar-title">Composants & États système</span>
      <div className="topbar-right">
        <button className="icon-btn" onClick={()=>setTheme(t=>t==='light'?'dark':'light')} aria-label="Changer de thème">
          {theme==='light'?<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>}
        </button>
      </div>
    </div>
    <div className="tab-bar">
      {TABS.map(([k,l])=><button key={k} className={`tab-btn${tab===k?' active':''}`} onClick={()=>setTab(k)}>{l}</button>)}
    </div>
    <div className="content">
      {tab==='skeleton'&&<>
        <div style={{marginBottom:24}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Squelettes de chargement</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Affichés pendant le chargement des données IoT, jamais un spinner générique.</p>
        </div>
        <SkeletonDashboard/>
      </>}
      {tab==='empty'&&<>
        <div style={{marginBottom:24}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>États vides</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Chaque état vide guide l'utilisateur vers l'action suivante.</p>
        </div>
        <div className="grid-2">
          <div className="card"><SkeletonDashboard/></div>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="card"><EmptySensor/></div>
            <div className="card"><EmptyAlerts/></div>
            <div className="card"><EmptyHistory/></div>
          </div>
        </div>
      </>}
      {tab==='errors'&&<>
        <div style={{marginBottom:24}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Pages d'erreur</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Erreurs gracieuses avec actions contextuelles.</p>
        </div>
        <div className="grid-2">
          <div className="card"><Error404/></div>
          <div className="card"><Error500/></div>
        </div>
      </>}
      {tab==='offline'&&<>
        <div style={{marginBottom:20}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Mode hors-ligne</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Bannière persistante, données en cache affichées, reconnexion automatique en cours.</p>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <OfflineBanner/>
          <div className="card" style={{padding:20,opacity:.55,pointerEvents:'none',filter:'grayscale(30%)'}}>
            <div style={{fontFamily:'var(--fd)',fontSize:'14px',fontWeight:600,marginBottom:12,color:'var(--tx-p)'}}>Dashboard (données en cache)</div>
            <SkeletonDashboard/>
          </div>
        </div>
      </>}
      {tab==='toasts'&&<>
        <div style={{marginBottom:20}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Toasts & Notifications contextuelles</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Apparaissent en bas à droite, disparaissent après 5s ou sur fermeture manuelle.</p>
        </div>
        <div className="card"><ToastSection/></div>
      </>}
      {tab==='notifs'&&<>
        <div style={{marginBottom:20}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Panneau de notifications</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Slide-in depuis l'icône cloche en en-tête. Points non-lus en ambre.</p>
        </div>
        <div style={{maxWidth:440}}><NotifPanel/></div>
      </>}
      {tab==='push'&&<>
        <div style={{marginBottom:20}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Notification push mobile</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Apparaît sur l'écran verrouillé ou en superposition sur Android/iOS.</p>
        </div>
        <PushMockup/>
      </>}
      {tab==='firstlogin'&&<>
        <div style={{marginBottom:20}}>
          <h2 style={{fontFamily:'var(--fd)',fontSize:'18px',fontWeight:700,marginBottom:4}}>Première connexion, Technicien</h2>
          <p style={{fontSize:'13px',color:'var(--tx-s)'}}>Forcé lors de la première connexion avec un mot de passe temporaire.</p>
        </div>
        <div className="card"><FirstLogin/></div>
      </>}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
{% endverbatim %}
</body>
</html>
