[pytest]
# Tests automatiques de l'assistant IA (chatbot), repris du laboratoire où il a été construit, sans Internet :
#     .venv_local\Scripts\python.exe -m pytest
# (les autres tests d'AOCEDA : .venv_local\Scripts\python.exe manage.py test)
DJANGO_SETTINGS_MODULE = aoceda.settings
testpaths = apps/ai_assistant/tests_chatbot
python_files = test_*.py
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore:StreamingHttpResponse must consume:Warning
